<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The box model</title>
  <style>
    body {
      background-color: whitesmoke;
    }

    .card {
      background-color: white;
      width: 300px;
      padding: 20px;
      border: 4px solid navy;
      margin: 40px auto;
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <article class="card">
    <h2>Ada Lovelace</h2>
    <p>Wrote what is called the first computer program, in 1843.</p>
  </article>

  <article class="card">
    <h2>Grace Hopper</h2>
    <p>Built one of the first compilers, in 1952.</p>
  </article>
</body>
</html>
