<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign up</title>
</head>
<body>
  <h1>Sign up</h1>

  <form>
    <!-- 1. A name field that is required -->
    <p>
      <label for="name">Name</label>
      <input id="name" type="text">
    </p>

    <!-- 2. An email field using type="email" -->
    <p>
      <label for="email">Email</label>
      <input id="email" type="text">
    </p>

    <!-- 3. A 5-digit postal code using pattern + title -->
    <p>
      <label for="postcode">Postal code</label>
      <input id="postcode" type="text">
    </p>

    <button>Sign up</button>
  </form>
</body>
</html>
